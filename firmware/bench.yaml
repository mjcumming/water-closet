# Bench controls are guarded here; physical GPIO switches remain internal.
# This is a wiring-test session, separate from Normal/Away/Shutdown.
script:
  - id: set_bench_mode
    mode: single
    parameters:
      enabled: bool
    then:
      - lambda: |-
          if (enabled) id(bench_test).begin(); else id(bench_test).end();
          id(selected_mode) = 2;
          id(system_mode).publish_state("Shutdown");
          id(controller) = water_closet::Controller{};
          id(local_selectors) = water_closet::LocalSelectors{};
          id(flush_request) = water_closet::Request::NONE;
          id(spin_button_armed) = !id(spin_flush_button).state;
          id(system_button_armed) = !id(system_flush_button).state;
      - script.execute: apply_control

switch:
  - platform: template
    name: Bench test
    id: bench_enabled
    restore_mode: DISABLED
    lambda: return id(bench_test).active();
    turn_on_action:
      - script.execute:
          id: set_bench_mode
          enabled: true
    turn_off_action:
      - script.execute:
          id: set_bench_mode
          enabled: false
  - platform: template
    name: Test OUT01
    id: test_out_1
    restore_mode: DISABLED
    lambda: return id(pump_contactor).state;
    turn_on_action:
      - lambda: id(bench_test).set(1, true);
      - script.execute: apply_control
    turn_off_action:
      - lambda: id(bench_test).set(1, false);
      - script.execute: apply_control
