button:
  - platform: template
    name: All outputs off
    on_press:
      - lambda: |-
          id(bench_test).all_off();
          id(selected_mode) = 2;
          id(system_mode).publish_state("Shutdown");
          id(controller) = water_closet::Controller{};
          id(local_selectors) = water_closet::LocalSelectors{};
          id(flush_request) = water_closet::Request::NONE;
      - script.execute: apply_control

binary_sensor:
  - platform: template
    name: Remote mode available
    lambda: |-
      return !id(bench_test).active() && id(controls_ready) &&
          !id(inputs_1_8).is_failed() && !id(inputs_1_8).status_has_warning() &&
          id(pump_selector_on).has_state() && id(pump_selector_auto).has_state() &&
          id(tank_selector_on).has_state() && id(tank_selector_auto).has_state() &&
          !id(pump_selector_on).state && id(pump_selector_auto).state &&
          !id(tank_selector_on).state && id(tank_selector_auto).state;
