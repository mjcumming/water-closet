# Starting behavior for review; first boot selects Shutdown.
# Restore mode/settings only. Never restore a valve or an active flush timer.
select:
  - platform: template
    name: System mode
    id: system_mode
    options:
      - Normal
      - Away
      - Shutdown
    optimistic: false
    update_interval: 1s
    lambda: |-
      return std::string(id(selected_mode) == 0 ? "Normal" : id(selected_mode) == 1 ? "Away" : "Shutdown");
    set_action:
      - lambda: |-
          using namespace water_closet;
          Inputs in;
          in.ready = id(controls_ready) && !id(inputs_1_8).is_failed() &&
              !id(inputs_1_8).status_has_warning() &&
              id(pump_selector_on).has_state() && id(pump_selector_auto).has_state() &&
              id(tank_selector_on).has_state() && id(tank_selector_auto).has_state();
          in.pump = decode(id(pump_selector_on).state, id(pump_selector_auto).state);
          in.tank = decode(id(tank_selector_on).state, id(tank_selector_auto).state);
          const Mode requested = x == "Normal" ? Mode::NORMAL : x == "Away" ? Mode::AWAY : Mode::SHUTDOWN;
          if (!remote_mode_allowed(requested, in, id(bench_test).active())) {
            ESP_LOGW("mode", "Normal/Away requires both selectors in Auto and bench testing off");
            return;
          }
          if (id(bench_test).active()) id(set_bench_mode).execute(false);
          id(selected_mode) = requested == Mode::NORMAL ? 0 : requested == Mode::AWAY ? 1 : 2;
          id(persist_mode).execute();
          id(system_mode).publish_state(x);
      - script.execute: apply_control

switch:
  - platform: template
    name: Automatic spin flushing
    id: spin_auto_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    name: Automatic system flushing
    id: system_auto_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  - platform: template
    name: Scheduled Away flushing
    id: away_auto_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    name: UV enable
    id: uv_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: apply_control
    on_turn_off:
      - script.execute: apply_control
  - platform: template
    name: Scheduled Away spin flushing
    id: away_spin_auto_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

number:
  - platform: template
    id: away_spin_flushes_per_day
    name: Away spin flushes per day
    unit_of_measurement: runs/day
    min_value: 1
    max_value: 4
    step: 1
    initial_value: 1
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: away_spin_duration
    name: Away spin flush duration
    unit_of_measurement: s
    min_value: 1
    max_value: 300
    step: 1
    initial_value: 30
