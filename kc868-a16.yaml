# KinCony KC868-A16 — wiring test
# The router assigns the address. The serial log prints it at boot.
# The page lists Input 1–16. Each Output switch turns that terminal on or off.
# Every output boots off.

esphome:
  name: kc868-a16
  friendly_name: KC868-A16

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 2
  local: true

i2c:
  sda: GPIO4
  scl:
    number: GPIO5
    ignore_strapping_warning: true
  scan: true

# KinCony mapping: 0x21 = inputs 1–8, 0x22 = inputs 9–16,
# 0x24 = outputs 1–8, 0x25 = outputs 9–16.
# Active-low on this board, so inverted: true means ON on the page
# is a closed input or an energized output.
pcf8574:
  - id: inputs_1_8
    address: 0x21
  - id: inputs_9_16
    address: 0x22
  - id: outputs_1_8
    address: 0x24
  - id: outputs_9_16
    address: 0x25

binary_sensor:
  - platform: gpio
    name: "Input 1"
    pin:
      pcf8574: inputs_1_8
      number: 0
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 2"
    pin:
      pcf8574: inputs_1_8
      number: 1
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 3"
    pin:
      pcf8574: inputs_1_8
      number: 2
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 4"
    pin:
      pcf8574: inputs_1_8
      number: 3
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 5"
    pin:
      pcf8574: inputs_1_8
      number: 4
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 6"
    pin:
      pcf8574: inputs_1_8
      number: 5
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 7"
    pin:
      pcf8574: inputs_1_8
      number: 6
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 8"
    pin:
      pcf8574: inputs_1_8
      number: 7
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 9"
    pin:
      pcf8574: inputs_9_16
      number: 0
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 10"
    pin:
      pcf8574: inputs_9_16
      number: 1
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 11"
    pin:
      pcf8574: inputs_9_16
      number: 2
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 12"
    pin:
      pcf8574: inputs_9_16
      number: 3
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 13"
    pin:
      pcf8574: inputs_9_16
      number: 4
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 14"
    pin:
      pcf8574: inputs_9_16
      number: 5
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 15"
    pin:
      pcf8574: inputs_9_16
      number: 6
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 16"
    pin:
      pcf8574: inputs_9_16
      number: 7
      mode: INPUT
      inverted: true

switch:
  - platform: gpio
    name: "Output 1"
    pin:
      pcf8574: outputs_1_8
      number: 0
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 2"
    pin:
      pcf8574: outputs_1_8
      number: 1
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 3"
    pin:
      pcf8574: outputs_1_8
      number: 2
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 4"
    pin:
      pcf8574: outputs_1_8
      number: 3
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 5"
    pin:
      pcf8574: outputs_1_8
      number: 4
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 6"
    pin:
      pcf8574: outputs_1_8
      number: 5
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 7"
    pin:
      pcf8574: outputs_1_8
      number: 6
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 8"
    pin:
      pcf8574: outputs_1_8
      number: 7
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 9"
    pin:
      pcf8574: outputs_9_16
      number: 0
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 10"
    pin:
      pcf8574: outputs_9_16
      number: 1
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 11"
