    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 12"
    pin:
      pcf8574: outputs_9_16
      number: 3
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 13"
    pin:
      pcf8574: outputs_9_16
      number: 4
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 14"
    pin:
      pcf8574: outputs_9_16
      number: 5
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 15"
    pin:
      pcf8574: outputs_9_16
      number: 6
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
