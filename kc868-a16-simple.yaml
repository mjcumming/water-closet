# KinCony KC868-A16 — switches and buttons hooked to outputs.
# No auto mode. Left or right on a selector turns that output on.
# Center, both contacts open, turns it off.
# Each flush button toggles its LED.
# The plain input/output page is still kc868-a16.yaml.

esphome:
  name: kc868-a16
  friendly_name: KC868-A16
  on_boot:
    priority: -100
    then:
      - script.execute: update_tank
      - script.execute: update_pump

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 2
  local: true

i2c:
  sda: GPIO4
  scl:
    number: GPIO5
    ignore_strapping_warning: true
  scan: true

pcf8574:
  - id: inputs_1_8
    address: 0x21
  - id: inputs_9_16
    address: 0x22
  - id: outputs_1_8
    address: 0x24
  - id: outputs_9_16
    address: 0x25

# ADS1115 wiring check. ADDR is tied to GND, so the address is 0x48.
# Gain 4.096 covers a jumper from a channel to the module's own 3.3 V pin.
ads1115:
  - address: 0x48
    id: current_adc

sensor:
  - platform: ads1115
    ads1115_id: current_adc
    multiplexer: A0_GND
    gain: "4.096"
    name: "ADC A0"
    update_interval: 1s
    accuracy_decimals: 3
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
  - platform: ads1115
    ads1115_id: current_adc
    multiplexer: A1_GND
    gain: "4.096"
    name: "ADC A1"
    update_interval: 1s
    accuracy_decimals: 3
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
  - platform: ads1115
    ads1115_id: current_adc
    multiplexer: A2_GND
    gain: "4.096"
    name: "ADC A2"
    update_interval: 1s
    accuracy_decimals: 3
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
  - platform: ads1115
    ads1115_id: current_adc
    multiplexer: A3_GND
    gain: "4.096"
    name: "ADC A3"
    update_interval: 1s
    accuracy_decimals: 3
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement

script:
  - id: update_tank
    mode: restart
    then:
      - if:
          condition:
            or:
              - binary_sensor.is_on: tank_left
              - binary_sensor.is_on: tank_right
          then:
            - switch.turn_on: tank_led
          else:
            - switch.turn_off: tank_led
  - id: update_pump
    mode: restart
    then:
      - if:
          condition:
            or:
              - binary_sensor.is_on: pump_left
              - binary_sensor.is_on: pump_right
          then:
            - switch.turn_on: pump_output
          else:
            - switch.turn_off: pump_output

switch:
  - platform: gpio
    name: "Output 1"
    pin:
      pcf8574: outputs_1_8
      number: 0
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 2"
    pin:
      pcf8574: outputs_1_8
      number: 1
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 3"
    pin:
      pcf8574: outputs_1_8
      number: 2
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 4"
    pin:
      pcf8574: outputs_1_8
      number: 3
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 5"
    pin:
      pcf8574: outputs_1_8
      number: 4
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 6"
    pin:
      pcf8574: outputs_1_8
      number: 5
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 7"
    pin:
      pcf8574: outputs_1_8
      number: 6
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 8"
    pin:
      pcf8574: outputs_1_8
      number: 7
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Water pump"
    id: pump_output
    pin:
      pcf8574: outputs_9_16
      number: 0
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Hot water tank LED"
    id: tank_led
    pin:
      pcf8574: outputs_9_16
      number: 1
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Filter flush LED"
    id: filter_flush_led
    pin:
      pcf8574: outputs_9_16
      number: 2
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Spin flush"
    id: spin_flush
    pin:
      pcf8574: outputs_9_16
      number: 3
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 13"
    pin:
      pcf8574: outputs_9_16
      number: 4
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 14"
    pin:
      pcf8574: outputs_9_16
      number: 5
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 15"
    pin:
      pcf8574: outputs_9_16
      number: 6
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Output 16"
    pin:
      pcf8574: outputs_9_16
      number: 7
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    name: "Hot water tank left"
    id: tank_left
    pin:
      pcf8574: inputs_1_8
      number: 0
      mode: INPUT
      inverted: true
    on_state:
      then:
        - script.execute: update_tank
  - platform: gpio
    name: "Hot water tank right"
    id: tank_right
    pin:
      pcf8574: inputs_1_8
      number: 1
      mode: INPUT
      inverted: true
    on_state:
      then:
        - script.execute: update_tank
  - platform: gpio
    name: "Water pump left"
    id: pump_left
    pin:
      pcf8574: inputs_1_8
      number: 2
      mode: INPUT
      inverted: true
    on_state:
      then:
        - script.execute: update_pump
  - platform: gpio
    name: "Water pump right"
    id: pump_right
    pin:
      pcf8574: inputs_1_8
      number: 3
      mode: INPUT
      inverted: true
    on_state:
      then:
        - script.execute: update_pump
  - platform: gpio
    name: "Spin filter flush"
    id: spin_filter_flush
    pin:
      pcf8574: inputs_1_8
      number: 4
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 100ms
    on_press:
      then:
        - switch.toggle: filter_flush_led
  - platform: gpio
    name: "UV"
    id: uv_button
    pin:
      pcf8574: inputs_1_8
      number: 5
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 100ms
    on_press:
      then:
        - switch.toggle: spin_flush
  - platform: gpio
    name: "Input 7"
    pin:
      pcf8574: inputs_1_8
      number: 6
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 8"
    pin:
      pcf8574: inputs_1_8
      number: 7
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 9"
    pin:
      pcf8574: inputs_9_16
      number: 0
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 10"
    pin:
      pcf8574: inputs_9_16
      number: 1
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 11"
    pin:
      pcf8574: inputs_9_16
      number: 2
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 12"
    pin:
      pcf8574: inputs_9_16
      number: 3
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 13"
    pin:
      pcf8574: inputs_9_16
      number: 4
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 14"
    pin:
      pcf8574: inputs_9_16
      number: 5
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 15"
    pin:
      pcf8574: inputs_9_16
      number: 6
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "Input 16"
    pin:
      pcf8574: inputs_9_16
      number: 7
      mode: INPUT
      inverted: true
